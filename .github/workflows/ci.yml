name: CI

"on":
  push:
  pull_request:
  schedule:
    # Nightly, full tier plus the sweep (13h.1, prompt 06 §6.9). UTC; v* tags also get the full tier below.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch supersedes the running checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: agents:check verifies that ledger rows cite commits on this branch (D-011).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # No dependencies needed: fails fast on a broken ledger, handoff, budget or decision log.
      - run: npm run agents:check
      - run: npm ci
      - run: npm run test
      - run: npm run build

  # Smoke gates every pull request to main (EVAL-P12-001), after the fast job passes: SMOKE_TIER=fast
  # there (about twenty scenarios, under three minutes; scripts/smoke/tiers.json). A nightly schedule and
  # v* tags run the full tier plus the sweep instead (13h.1, prompt 06 §6.9) and upload output/.
  browser-gates:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SMOKE_PORT: '4400'
      SMOKE_TIER: ${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'full' || 'fast' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The fast tier never runs 66-production-music (needs dist/), but build unconditionally: it is
      # cheap next to the browser steps and the full tier (nightly, v* tags) always needs it.
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run test:visual-sweep
        if: (success() || failure()) && env.SMOKE_TIER == 'full'
        env:
          SWEEP_CLEANUP_TIMEOUT_MS: '30000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
