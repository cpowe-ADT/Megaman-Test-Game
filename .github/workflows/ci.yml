name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: agents:check verifies that ledger rows cite commits on this branch (D-011).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # No dependencies needed: fails fast on a broken ledger, handoff, budget or decision log.
      - run: npm run agents:check
      - run: npm ci
      - run: npm run test
      - run: npm run build

  browser-gates:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
        env:
          SMOKE_PORT: '4400'
      - run: npm run test:visual-sweep
        if: success() || failure()
        env:
          SWEEP_CLEANUP_TIMEOUT_MS: '30000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
