<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>OMEGA RELAY</title>
    <style>
      html, body, #app { height: 100%; margin: 0; background: #0b0d12; }
      canvas {
        image-rendering: auto;
        image-rendering: crisp-edges;
      }
      /* The touch overlay (src/input/touch/TouchOverlay.ts): a DOM layer sized to match the canvas's
         CSS box each frame, so taps line up at any window size or render scale. */
      .touch-overlay-root {
        position: fixed;
        z-index: 2000;
        pointer-events: none;
        touch-action: none;
      }
      .touch-btn {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        min-width: 44px;
        min-height: 44px;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        background: rgba(8, 23, 42, 0.5);
        border: 2px solid rgba(204, 236, 255, 0.35);
        border-radius: 6px;
        color: #ecf7ff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        font-weight: 600;
      }
      .touch-btn.round { border-radius: 50%; }
      .touch-btn.pressed { background: rgba(27, 136, 255, 0.45); }
      .touch-toggle {
        position: fixed;
        left: 8px;
        bottom: 8px;
        z-index: 2001;
        display: none;
        align-items: center;
        justify-content: center;
        min-width: 60px;
        min-height: 26px;
        padding: 2px 8px;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        background: rgba(8, 23, 42, 0.6);
        border: 1px solid rgba(204, 236, 255, 0.4);
        border-radius: 6px;
        color: #ecf7ff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
      }
      .touch-orientation-hint {
        position: fixed;
        inset: 0;
        z-index: 1999;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        background: rgba(3, 7, 17, 0.55);
        color: #ecf7ff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 16px;
        text-align: center;
      }
      /* The tap-to-start card (v2): full-screen, blocks the canvas until tapped. */
      .touch-start-card {
        position: fixed;
        inset: 0;
        z-index: 3000;
        display: none;
        align-items: center;
        justify-content: center;
        touch-action: none;
        pointer-events: auto;
        background: rgba(3, 7, 17, 0.9);
        color: #ecf7ff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .touch-start-card-inner {
        padding: 18px 28px;
        border: 2px solid rgba(204, 236, 255, 0.6);
        border-radius: 10px;
        font-size: 20px;
        line-height: 1.6;
        text-align: center;
        background: rgba(8, 23, 42, 0.7);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
